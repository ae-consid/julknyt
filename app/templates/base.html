<!doctype html>
{%- set theme = theme|default('classic') -%}
<html lang="sv" data-event-theme="{{ theme }}"{% if theme in THEME_PICO_MODES %} data-theme="{{ THEME_PICO_MODES[theme] }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Julknyt{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
        integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
  <header class="site-header">
    <nav class="container">
      <ul><li><a href="{{ url_for('main.index') }}"><strong><span class="brand-tree">🎄</span><span class="brand-pumpkin">🎃</span> Julknyt</strong></a></li></ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p class="footer-christmas">🎁 God Jul! ❄️</p>
    <p class="footer-halloween">🦇 Glad Halloween! 🎃 Bu! 👻</p>
  </footer>
</body>
</html>
