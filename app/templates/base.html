<!doctype html>
<html lang="en" data-event-theme="{{ theme|default('classic') }}"{% if theme == 'christmas' %} data-theme="light"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Julknyt{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
  <header class="site-header">
    <nav class="container">
      <ul><li><a href="{{ url_for('main.index') }}"><strong>🎄 Julknyt</strong></a></li></ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>🎁 God Jul &amp; Merry Christmas! ❄️</p>
  </footer>
</body>
</html>
