{% extends "base.html" %}
{% block content %}
<h1>Planera ert knytkalas</h1>
<p>Skapa ett evenemang, dela länken och låt alla anmäla vad de tar med.</p>
<form method="post">
  {{ form.hidden_tag() }}
  {% for field in [form.title, form.date, form.location, form.host_name, form.theme] %}
    <label>{{ field.label.text }} {{ field() }}
      {% for err in field.errors %}<small>{{ err }}</small>{% endfor %}
    </label>
  {% endfor %}
  <button type="submit">Skapa evenemang</button>
</form>
<script>
  // Live preview of the chosen theme; the server applies it for real once the event exists.
  document.getElementById("theme").addEventListener("change", function () {
    var html = document.documentElement;
    var picoModes = { christmas: "light", halloween: "dark" };  // keep in sync with base.html
    html.dataset.eventTheme = this.value;
    if (picoModes[this.value]) html.dataset.theme = picoModes[this.value];
    else delete html.dataset.theme;
  });
</script>
{% endblock %}
